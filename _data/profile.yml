bio: Builds media tooling, GPU pipelines, and self-hosted infra
summary: >-
  Projects span GPU video processing, self-hosted services and appliances, and
  small web apps. The common thread is practical tooling that runs on my own
  hardware, from FFmpeg and CUDA pipelines to Docker stacks and WireGuard-gated
  remote access.
