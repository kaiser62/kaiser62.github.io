    external players. It is installable as a PWA and targets iOS Safari.
  tech: [TypeScript, Next.js, React, Tailwind CSS, Docker]
  private: true
  featured: true
  homepage: ""

- slug: ppsa
  title: ppsa
  tagline: Portable Palworld server appliance that boots from USB
  description: >-
    A bootable Debian image that runs a full Palworld dedicated server from a
    USB drive, SSD or VM disk. It uses a Secure Boot-signed boot chain, a Docker
    Compose stack with a web UI, WireGuard-gated remote access, a Wi-Fi setup
    hotspot and scheduled backups.
  tech: [Shell, Python, Docker, WireGuard, Debian]
  private: false
  featured: false
  homepage: ""

